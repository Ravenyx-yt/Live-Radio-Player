<meta name="mobile-web-app-capable" content="yes">
<title>Live Radio</title>
<style>
@property --acc{syntax:'<color>';inherits:true;initial-value:#FF5A5F}
:root{--acc:#FF5A5F;--bg:#0F0F14;--ln:#2A2A34;--tx:#ECECF1;--mu:#A4A4B0;color-scheme:dark;transition:--acc .6s;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sc{position:absolute;inset:0;opacity:0;transition:opacity .9s;overflow:hidden}
.sc.on{opacity:1}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font-size:1.15rem;color:var(--acc);white-space:nowrap}
#badge{display:none;font:700 10px/1 inherit;padding:4px 7px;border-radius:3px;white-space:nowrap}
.r{display:flex;align-items:center;gap:10px}
#clk{font-weight:600;font-size:.95rem}
#live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#ff6b6b;opacity:0;transition:opacity .4s}
#live i{width:9px;height:9px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 10px #ff3b3b;animation:pu .9s ease-in-out infinite alternate}
.playing #live{opacity:1}
.hero{display:grid;justify-items:center;gap:10px;text-align:center;margin-top:10px}
.stage{position:relative;width:min(68vw,300px);aspect-ratio:1;border-radius:50%;border:1px dashed var(--ln)}
.idle{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);transition:opacity .4s}
.playing .idle{opacity:0}
.vinyl{position:absolute;inset:-1px;border-radius:50%;opacity:0;transition:opacity .6s;animation:spin 4s linear infinite;animation-play-state:paused;
background:conic-gradient(from 20deg,#ffffff22 0 28deg,transparent 28deg 180deg,#ffffff22 180deg 208deg,transparent 208deg),repeating-radial-gradient(circle,#17171d 0 3px,#0b0b0e 3px 6px);box-shadow:inset 0 0 0 2px #2a2a32}
.vinyl::before{content:"";position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle at 50% 14%,#fff 0 4%,transparent 4.5%),var(--acc)}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:5%;aspect-ratio:1;border-radius:50%;background:var(--bg);transform:translate(-50%,-50%)}
.playing .vinyl{opacity:.95;animation-play-state:running}
.now{font-size:1.3rem;font-weight:700;min-height:1.5em}
.stat{color:var(--mu);font-size:.85rem;min-height:2.4em;max-width:32ch}
button,input{font:inherit}
.go{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:13px 42px;font-weight:700;min-width:160px;cursor:pointer}
.go:active{opacity:.75}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.vol{width:100%;margin:16px 0 0;accent-color:var(--acc)}
.lbl{display:block;margin-top:16px;color:var(--mu);font-size:.8rem}
#list{list-style:none;margin:6px 0 0;padding:6px;display:grid;gap:3px;background:#00000066;border-radius:12px}
#list button{width:100%;text-align:left;background:transparent;color:var(--tx);border:0;border-radius:8px;padding:13px 12px;cursor:pointer}
#list button[aria-current="true"]{background:var(--acc);color:#fff}
.custom{display:flex;gap:8px;margin-top:6px}
.custom input{flex:1;min-width:0;background:#1c1c24cc;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px}
.custom button{background:#2A2A34;color:#fff;border:0;border-radius:10px;padding:0 16px;cursor:pointer}
.rv{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:2;opacity:.4;font-size:11px;line-height:1.15;text-align:right;letter-spacing:.2em;font-weight:700;pointer-events:none}
.rv small{display:block;font-size:7px}
.sw{position:absolute;left:50%;top:50%;width:0;height:0;animation:rot 120s linear infinite}
.sw div{position:absolute;border-radius:50%;animation:dr var(--d) ease-in-out infinite alternate}
.sp{position:absolute;left:62%;top:0;animation:bob 2.6s ease-in-out infinite alternate}
.sc svg{overflow:visible}
#gear{background:none;border:0;color:var(--tx);font-size:1.25rem;padding:4px 6px;cursor:pointer}
#upd{margin-top:8px}
#upd button{width:100%;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:700}
#set{position:fixed;inset:0;z-index:5;background:#000a;display:flex;align-items:flex-end;justify-content:center}
#set[hidden],#upd[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:#14141c;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:1.1rem}
.sheet hr{border:0;border-top:1px solid var(--ln);margin:14px 0}
.chk{display:flex;gap:10px;align-items:center;margin-top:10px}
.sheet input[type=url],.sheet textarea{width:100%;background:#1c1c24;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-top:6px}
.row{display:flex;gap:8px;margin-top:12px}
.row button{background:#2A2A34;color:#fff;border:0;border-radius:10px;padding:11px 16px;cursor:pointer}
.row .pri{background:var(--acc);font-weight:700}
.nofx #bg{display:none}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px}
button{touch-action:manipulation}
.ios .vol,.ios label[for=sVol],.ios #sVol{display:none}
#tip{margin-top:8px;background:#1c1c24cc;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--mu)}
#tip[hidden]{display:none}
#tip button{float:right;background:none;border:0;color:var(--tx);font-size:1rem}
.cols{display:block}
@media (min-width:820px){main{max-width:1100px}.cols{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:28px;align-items:start}.cols .l{position:sticky;top:16px}.cols .r{max-height:calc(100vh - 110px);overflow:auto}.stage{width:min(40vw,360px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes dr{from{transform:translate(calc(var(--x)*-1),calc(var(--y)*-1)) scale(.88)}to{transform:translate(var(--x),var(--y)) scale(1.2)}}
@keyframes pu{to{opacity:.3}}
@keyframes wv{to{transform:translateX(-50%)}}
@keyframes tw{from{opacity:.08}to{opacity:1}}
@keyframes carR{from{transform:translateX(-80px)}to{transform:translateX(430px)}}
@keyframes carL{from{transform:translateX(430px)}to{transform:translateX(-30px)}}
@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes bob{to{transform:translateY(40px)}}
@keyframes bl{to{opacity:.15}}
@keyframes sw2{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
@keyframes rideB{from{transform:translateX(-320px)}to{transform:translateX(820px)}}
@keyframes glow{from{opacity:.8}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.vinyl{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <header>
    <div class="brand"><b>Live Radio</b><span id="badge"></span></div>
    <div class="r"><span id="live"><i></i>LIVE</span><time id="clk"></time><button id="gear" type="button" aria-label="Settings">&#9881;</button></div>
  </header>
  <div id="upd" hidden></div>
  <div id="tip" hidden><button id="tipX" type="button" aria-label="Dismiss">&#10005;</button>To install: tap <b>Share</b>, then <b>Add to Home Screen</b>. Use your device&rsquo;s volume buttons to change the volume.</div>
  <div class="cols"><div class="l">
  <section class="hero">
    <div class="stage"><div class="idle">Pick a station</div><div class="vinyl" aria-hidden="true"></div></div>
    <div class="now" id="now"></div>
    <div class="stat" id="stat" role="status" aria-live="polite">Stopped</div>
    <button class="go" id="go" type="button">Play</button>
  </section>
  <input class="vol" id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </div><div class="r">
  <span class="lbl">Stations</span>
  <ul id="list"></ul>
  <label class="lbl" for="url">Custom stream URL</label>
  <div class="custom"><input id="url" type="url" inputmode="url" placeholder="https://example.com/stream"><button id="g2" type="button">Play URL</button></div>
  </div></div>
</main>
<div id="set" hidden>
 <div class="sheet">
  <h2>Settings</h2>
  <label class="lbl" for="sUrl">Update source (link to your radio-manifest.json)</label>
  <input id="sUrl" type="url" inputmode="url" placeholder="https://.../radio-manifest.json">
  <label class="chk"><input type="checkbox" id="sChk"> Check for updates when the app opens</label>
  <label class="chk"><input type="checkbox" id="sRem"> Use the station list from the update source</label>
  <div class="row"><button id="sNow" type="button">Check for updates now</button></div>
  <div class="stat" id="sSt" role="status"></div>
  <hr>
  <label class="chk"><input type="checkbox" id="sFx"> Animated station backgrounds</label>
  <label class="chk"><input type="checkbox" id="s24"> 24-hour clock</label>
  <label class="chk"><input type="checkbox" id="sLast"> Remember my last station</label>
  <label class="lbl" for="sVol">Default volume</label>
  <input class="vol" id="sVol" type="range" min="0" max="100">
  <label class="lbl" for="sMine">My stations (one per line: Name | Link)</label>
  <textarea id="sMine" rows="4"></textarea>
  <div class="row"><button id="sSave" class="pri" type="button">Save</button><button id="sClose" type="button">Close</button></div>
 </div>
</div>
<div class="rv">R A V E N<small>S T U D I O S &copy;</small></div>

// soft drifting gradient haze (KIIS and Purple Cat)
function haze(k,b,cols,seed){
 const s=scene(k),r=R(seed);
 s.style.background=`linear-gradient(135deg,${b[0]},${b[1]} 55%,${b[2]})`;
 const w=D('sw',s);
 [[-20,-6,43],[18,-10,40],[3,14,45],[-13,16,36],[22,12,33],[-2,-17,33],[0,0,47]].forEach((q,i)=>{const c=cols[i];
  D('',w,`left:${q[0]-q[2]/2}vmax;top:${q[1]-q[2]/2}vmax;width:${q[2]}vmax;height:${q[2]}vmax;background:radial-gradient(circle,${c}b0,${c}70 50%,${c}00 70%);--x:${6+r()*3}vmax;--y:${5+r()*4}vmax;--d:${9+r()*8|0}s;animation-delay:-${r()*10|0}s`)});
 return s}

 const s=haze('forest',['#031009','#0B3B1E','#052414'],['#1F7A3D','#2E9E50','#0E4D2A','#3FBF6A','#145A32','#6FD38A','#0B3D22'],5),r=R(23);

 v.style.cssText='position:absolute;left:0;top:0;width:100%;height:62vh';s.appendChild(v);

   for(let j=1;j<=st;j++){const t=j/st,sx=x0+5*Math.sin(t*5+ph)*t,sy=py+t*L;stem+=`L${F(sx)},${F(sy)}`;

 E('circle',{cx:270,cy:138,r:52,fill:'url(#sunG)',style:'animation:glow 4s ease-in-out infinite alternate'},v);

  E('path',{d:f,fill:'#12081C'},g)}
 // ground, road, lane line

 E('path',{d:d+'L400,200Z',fill:'#1A0E28'},v);

 E('line',{x1:0,y1:186,x2:400,y2:186,stroke:'#FFC15A','stroke-width':1,'stroke-dasharray':'3 4',opacity:.55},v);
 // saguaro cacti
 [50,170,340].forEach(cx=>{const ch=26+r()*14,b=158;
  E('path',{d:`M${cx},${b}L${cx},${b-ch}M${cx},${F(b-ch*.45)}L${cx-6},${F(b-ch*.45)}L${cx-6},${F(b-ch*.7)}M${cx},${F(b-ch*.6)}L${cx+6},${F(b-ch*.6)}L${cx+6},${F(b-ch*.85)}`,
   stroke:'#0F0716','stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round',fill:'none'},v)});
 // motorcycle and rider (design 300x160, scaled), riding left to right
 const st=(dd,w)=>`<path d="${dd}" stroke="${dk}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
 const wheel=cx=>`<g style="transform-box:fill-box;transform-origin:center;animation:spin 2.3s linear infinite"><circle cx="${cx}" cy="118" r="28" fill="none" stroke="${dk}" stroke-width="8"/><circle cx="${cx}" cy="118" r="22" fill="none" stroke="#3A2848" stroke-width="1.5"/><path d="M${cx-22},118L${cx+22},118M${cx},96L${cx},140M${cx-15.5},102.5L${cx+15.5},133.5M${cx-15.5},133.5L${cx+15.5},102.5" stroke="#3A2848" stroke-width="1.5"/></g>`;
 const bk=E('g',{transform:'translate(0 116) scale(.5)'},v),mv=E('g',{style:'animation:rideB 14s linear infinite'},bk);
 mv.innerHTML=`<g fill="${dk}"><path d="M28,114Q62,66 98,100L91,105Q62,82 35,116Z"/><path d="M58,90Q92,72 130,82L128,93Q92,88 64,100Z"/><path d="M126,82Q150,56 190,72Q198,77 193,89Q160,84 130,97Z"/><path d="M116,96L194,92L202,114L186,130L130,130L110,114Z"/><path d="M138,94L150,70L160,72L154,96Z"/><path d="M168,94L182,72L192,77L178,96Z"/><path d="M98,88L110,48Q122,40 134,48L128,90Z"/><ellipse cx="120" cy="32" rx="10" ry="9"/><circle cx="206.5" cy="73.5" r="7.5"/></g>`
  +st('M200,68L240,118',5)+st('M198,66Q188,36 170,26',3.5)+st('M62,118L128,124',6)+st('M150,128L84,138',8)+st('M154,124L90,131',6)+st('M124,52L150,44L170,28',7)+st('M112,90L156,102L170,128',10)
  +'<circle cx="209" cy="74" r="4" fill="#FFD27A"/>'+wheel(62)+wheel(238)}

haze('kiis',['#1E0B3D','#4A1763','#1A1050'],['#FF3D9A','#FF8A3D','#7B3FE4','#3DD6D0','#FF5AD0','#FFC15A','#4B2BB5'],11);
waves();city();webs();blues();forest();ride();

['Purple Cat Radio','https://das-edge63-live365-dal03.cdnstream.com/a30440?listeningSessionId=V1dDRUc3NFhLVzZZUjJMUDNPVE9WQVFPR01fZGFzLWVkZ2U2My1saXZlMzY1LWRhbDAzLmNkbnN0cmVhbS5jb206ODE4Ng..&aw_0_1st.playerId=Live365-Widget&aw_0_1st.skey=1792727280480','forest'],
['102.7 KIIS FM','https://cloud.revma.ihrhls.com/zc185?rj-org=n1cb-e2&rj-ttl=5&rj-tok=AAABoWaQOGYAbs2WXHLwNU64vQ','kiis']
];
let ST=DEF;
// accent colour and logo badge per station theme
const TH={harley:['#FF6A00','HARLEY-DAVIDSON','#FF6A00','#0F0F14'],blues:[0,'HARLEY-DAVIDSON','#FF6A00','#0F0F14'],sim:[0,'SIMULATOR RADIO','#2F6FDE','#fff'],coast:['#1EB4E6']};

// ---- settings and updates ----
const APP_V='1.0.0';
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return {}}};
const sv=(k,v)=>{try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v))}catch(e){}};
const cfg=Object.assign({url:'https://raw.githubusercontent.com/Ravenyx-yt/Live-Radio-Player/refs/heads/main/radio-manifest.json',check:true,remote:true,fx:true,h24:false,vol:80,keep:false,mine:'',ver:0,last:''},ld('radio.cfg'));
const stationsFrom=m=>(m&&Array.isArray(m.stations)?m.stations:[]).filter(x=>x&&x.name&&x.url).map(x=>[x.name,x.url,x.theme||'']);
const newer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){const p=x[i]||0,q=y[i]||0;if(p!==q)return p>q}return false};

const a=new Audio();a.preload='none';
let cur=-1,want=false,last=null;
const list=$('list'),now=$('now'),stat=$('stat'),go=$('go'),vol=$('vol'),badge=$('badge');
function render(){list.innerHTML='';ST.forEach((s,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.textContent=s[0];b.onclick=()=>start({n:s[0],u:s[1],t:s[2]||''},i);li.appendChild(b);list.appendChild(li)})}
const mark=()=>list.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',i===cur?'true':'false'));
function theme(t){
 const h=TH[t]||[];
 document.documentElement.style.setProperty('--acc',h[0]||'#FF5A5F');
 if(h[1]){badge.textContent=h[1];badge.style.cssText=`display:inline-block;background:${h[2]};color:${h[3]}`}else badge.style.display='none';
 bg.querySelectorAll('.sc').forEach(e=>e.classList.toggle('on',e.dataset.k===t))}
function media(st){try{if('mediaSession' in navigator){
 navigator.mediaSession.metadata=new MediaMetadata({title:st.n,artist:'Live Radio',artwork:[{src:ICON,sizes:'192x192',type:'image/png'}]});
 navigator.mediaSession.setActionHandler('play',()=>start(last,cur));
 navigator.mediaSession.setActionHandler('pause',stop);navigator.mediaSession.setActionHandler('stop',stop)}}catch(e){}}
function start(st,i){
 if(cfg.keep&&st.n!=='Custom stream'){cfg.last=st.n;sv('radio.cfg',cfg)}
 last=st;want=true;cur=i===undefined?-1:i;mark();
 now.textContent=st.n;stat.textContent='Connecting\u2026';go.textContent='Stop';
 theme(st.t);a.src=st.u;
 const p=a.play();if(p&&p.catch)p.catch(e=>{if(!e||e.name!=='AbortError')if(want)fail()});
 media(st)}
function stop(){
 want=false;document.body.classList.remove('playing');
 a.pause();a.removeAttribute('src');a.load();
 go.textContent='Play';stat.textContent='Stopped';theme('')}
function fail(){
 want=false;document.body.classList.remove('playing');go.textContent='Play';theme('');
 stat.textContent='Can\u2019t play this stream. Try another station, and check that the link uses https.'}
a.addEventListener('playing',()=>{document.body.classList.add('playing');stat.textContent='Live';try{navigator.mediaSession.playbackState='playing'}catch(e){}});
a.addEventListener('waiting',()=>{if(want)stat.textContent='Buffering\u2026'});
a.addEventListener('pause',()=>{document.body.classList.remove('playing');try{navigator.mediaSession.playbackState='paused'}catch(e){}});
a.addEventListener('error',()=>{if(want)fail()});
go.onclick=()=>{if(want)stop();else if(last)start(last,cur);else start({n:ST[0][0],u:ST[0][1],t:''},0)};
vol.value=cfg.vol/100;vol.oninput=()=>{a.volume=+vol.value};a.volume=+vol.value;
$('g2').onclick=()=>{let u=$('url').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;start({n:'Custom stream',u,t:''})};
const tick=()=>{$('clk').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:!cfg.h24})};
tick();setInterval(tick,1000);
// station list = built-ins, or the list synced from the update source, plus "My stations"
function build(){
 let l=DEF;
 if(cfg.remote){try{const r=stationsFrom(JSON.parse(localStorage.getItem('radio.manifest')));if(r.length)l=r}catch(e){}}
 const mine=cfg.mine.split('\n').map(s=>s.split('|').map(t=>t.trim())).filter(p=>p.length>1&&p[0]&&p[1]).map(p=>[p[0],p[1],p[2]||'']);
 ST=l.concat(mine);
 if(last)cur=ST.findIndex(s=>s[0]===last.n);
 render();mark()}
function restore(){
 if(!cfg.keep||!cfg.last)return;
 const i=ST.findIndex(s=>s[0]===cfg.last);if(i<0)return;
 cur=i;last={n:ST[i][0],u:ST[i][1],t:ST[i][2]||''};now.textContent=last.n;mark()}
// read radio-manifest.json: sync stations and announce new versions of this page
async function check(manual){
 const out=$('sSt'),say=t=>{if(manual)out.textContent=t};
 if(!cfg.url){say('Enter the update source link first.');return}
 say('Checking\u2026');
 try{
  const r=await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
  const txt=await r.text(),m=JSON.parse(txt),msg=[],rs=stationsFrom(m);
  if(cfg.remote&&rs.length){
   if((+m.version||0)>cfg.ver||!localStorage.getItem('radio.manifest')){
    sv('radio.manifest',txt);cfg.ver=+m.version||0;sv('radio.cfg',cfg);build();
    msg.push('Station list updated to version '+cfg.ver+' ('+rs.length+' stations).')}
   else msg.push('Station list is up to date (version '+cfg.ver+').')}
  const mo=m.ios||m.mobile;
  if(mo&&mo.version&&newer(mo.version,APP_V)){
   const u=$('upd');u.hidden=false;u.innerHTML='';
   const b=document.createElement('button');b.type='button';b.textContent='New version '+mo.version+' available \u2013 tap to update';
   b.onclick=()=>{if(mo.url&&new URL(mo.url,location.href).href!==location.href)location.href=mo.url;else location.reload()};
   u.appendChild(b);msg.push('A new version of this page is available ('+mo.version+').')}
  else msg.push('This page is up to date ('+APP_V+').');
  say(msg.join(' '))
 }catch(e){say('Could not read the update source. Check the link, and that its host allows other sites to read it.')}}
const sh=$('set');
$('gear').onclick=()=>{
 $('sUrl').value=cfg.url;$('sChk').checked=cfg.check;$('sRem').checked=cfg.remote;$('sFx').checked=cfg.fx;
 $('s24').checked=cfg.h24;$('sLast').checked=cfg.keep;$('sVol').value=cfg.vol;$('sMine').value=cfg.mine;$('sSt').textContent='';sh.hidden=false};
$('sClose').onclick=()=>{sh.hidden=true};
$('sNow').onclick=()=>{cfg.url=$('sUrl').value.trim();cfg.remote=$('sRem').checked;check(true)};
$('sSave').onclick=()=>{
 cfg.url=$('sUrl').value.trim();cfg.check=$('sChk').checked;cfg.remote=$('sRem').checked;cfg.fx=$('sFx').checked;
 cfg.h24=$('s24').checked;cfg.keep=$('sLast').checked;cfg.vol=+$('sVol').value;cfg.mine=$('sMine').value;
 sv('radio.cfg',cfg);document.body.classList.toggle('nofx',!cfg.fx);build();tick();sh.hidden=true};
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(IOS){document.body.classList.add('ios');
 if(!navigator.standalone&&!ld('radio.tip').x){const t=$('tip');t.hidden=false;$('tipX').onclick=()=>{t.hidden=true;sv('radio.tip',{x:1})}}}
try{const mf={name:'Live Radio Player',short_name:'Live Radio',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0F0F14',theme_color:'#0F0F14',icons:[{src:ICON,sizes:'192x192',type:'image/png'}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
build();theme('');restore();
document.body.classList.toggle('nofx',!cfg.fx);
if(cfg.check&&cfg.url)check(false);
})();
