<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Live Radio</title>
<style>
@property --acc{syntax:'<color>';inherits:true;initial-value:#FF5A5F}
:root{--acc:#FF5A5F;--bg:#0F0F14;--ln:#2A2A34;--tx:#ECECF1;--mu:#A4A4B0;color-scheme:dark;transition:--acc .6s;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sc{position:absolute;inset:0;opacity:0;transition:opacity .9s;overflow:hidden}
.sc.on{opacity:1}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font-size:1.15rem;color:var(--acc);white-space:nowrap}
#badge{display:none;font:700 10px/1 inherit;padding:4px 7px;border-radius:3px;white-space:nowrap}
.r{display:flex;align-items:center;gap:10px}
#clk{font-weight:600;font-size:.95rem}
#live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#ff6b6b;opacity:0;transition:opacity .4s}
#live i{width:9px;height:9px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 10px #ff3b3b;animation:pu .9s ease-in-out infinite alternate}
.playing #live{opacity:1}
.hero{display:grid;justify-items:center;gap:10px;text-align:center;margin-top:10px}
.stage{position:relative;width:min(68vw,300px);aspect-ratio:1;border-radius:50%;border:1px dashed var(--ln)}
.idle{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);transition:opacity .4s}
.playing .idle{opacity:0}
.vinyl{position:absolute;inset:-1px;border-radius:50%;opacity:0;transition:opacity .6s;animation:spin 4s linear infinite;animation-play-state:paused;
background:conic-gradient(from 20deg,#ffffff22 0 28deg,transparent 28deg 180deg,#ffffff22 180deg 208deg,transparent 208deg),repeating-radial-gradient(circle,#17171d 0 3px,#0b0b0e 3px 6px);box-shadow:inset 0 0 0 2px #2a2a32}
.vinyl::before{content:"";position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle at 50% 14%,#fff 0 4%,transparent 4.5%),var(--acc)}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:5%;aspect-ratio:1;border-radius:50%;background:var(--bg);transform:translate(-50%,-50%)}
.playing .vinyl{opacity:.95;animation-play-state:running}
.now{font-size:1.3rem;font-weight:700;min-height:1.5em}
.stat{color:var(--mu);font-size:.85rem;min-height:2.4em;max-width:32ch}
button,input{font:inherit}
.go{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:13px 42px;font-weight:700;min-width:160px;cursor:pointer}
.go:active{opacity:.75}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.vol{width:100%;margin:16px 0 0;accent-color:var(--acc)}
.lbl{display:block;margin-top:16px;color:var(--mu);font-size:.8rem}
#list{list-style:none;margin:6px 0 0;padding:6px;display:grid;gap:3px;background:#00000066;border-radius:12px}
#list button{width:100%;text-align:left;background:transparent;color:var(--tx);border:0;border-radius:8px;padding:13px 12px;cursor:pointer}
#list button[aria-current="true"]{background:var(--acc);color:#fff}
.custom{display:flex;gap:8px;margin-top:6px}
.custom input{flex:1;min-width:0;background:#1c1c24cc;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px}
.custom button{background:#2A2A34;color:#fff;border:0;border-radius:10px;padding:0 16px;cursor:pointer}
.rv{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:2;opacity:.4;font-size:11px;line-height:1.15;text-align:right;letter-spacing:.2em;font-weight:700;pointer-events:none}
.rv small{display:block;font-size:7px}
.sw{position:absolute;left:50%;top:50%;width:0;height:0;animation:rot 120s linear infinite}
.sw div{position:absolute;border-radius:50%;animation:dr var(--d) ease-in-out infinite alternate}
.sp{position:absolute;left:62%;top:0;animation:bob 2.6s ease-in-out infinite alternate}
.sc svg{overflow:visible}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes dr{from{transform:translate(calc(var(--x)*-1),calc(var(--y)*-1)) scale(.88)}to{transform:translate(var(--x),var(--y)) scale(1.2)}}
@keyframes pu{to{opacity:.3}}
@keyframes wv{to{transform:translateX(-50%)}}
@keyframes tw{from{opacity:.08}to{opacity:1}}
@keyframes carR{from{transform:translateX(-80px)}to{transform:translateX(430px)}}
@keyframes carL{from{transform:translateX(430px)}to{transform:translateX(-30px)}}
@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes bob{to{transform:translateY(40px)}}
@keyframes bl{to{opacity:.15}}
@media (prefers-reduced-motion:reduce){.vinyl{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <header>
    <div class="brand"><b>Live Radio</b><span id="badge"></span></div>
    <div class="r"><span id="live"><i></i>LIVE</span><time id="clk"></time></div>
  </header>
  <section class="hero">
    <div class="stage"><div class="idle">Pick a station</div><div class="vinyl" aria-hidden="true"></div></div>
    <div class="now" id="now"></div>
    <div class="stat" id="stat" role="status" aria-live="polite">Stopped</div>
    <button class="go" id="go" type="button">Play</button>
  </section>
  <input class="vol" id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  <span class="lbl">Stations</span>
  <ul id="list"></ul>
  <label class="lbl" for="url">Custom stream URL</label>
  <div class="custom"><input id="url" type="url" inputmode="url" placeholder="https://example.com/stream"><button id="g2" type="button">Play URL</button></div>
</main>
<div class="rv">R A V E N<small>S T U D I O S &copy;</small></div>
<script>
(function(){
const $=i=>document.getElementById(i),NS='http://www.w3.org/2000/svg',bg=$('bg');
const R=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const F=n=>+n.toFixed(1);
const E=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const D=(c,p,s)=>{const d=document.createElement('div');d.className=c;if(s)d.style.cssText=s;if(p)p.appendChild(d);return d};
const scene=k=>{const d=D('sc',bg);d.dataset.k=k;return d};
// one leaf shape: two curves from base to tip
const lf=(bx,by,a,len,w,dr)=>{const dx=Math.cos(a),dy=Math.sin(a),nx=-dy,ny=dx,tx=bx+len*dx,ty=by+len*dy+(dr||0),mx=bx+len*.5*dx,my=by+len*.5*dy;
 return `M${F(bx)},${F(by)}Q${F(mx+w*nx)},${F(my+w*ny)} ${F(tx)},${F(ty)}Q${F(mx-w*nx)},${F(my-w*ny)} ${F(bx)},${F(by)}Z`};

// soft drifting gradient haze (KIIS and Purple Cat)
function haze(k,b,cols,seed){
 const s=scene(k),r=R(seed);
 s.style.background=`linear-gradient(135deg,${b[0]},${b[1]} 55%,${b[2]})`;
 const w=D('sw',s);
 [[-20,-6,43],[18,-10,40],[3,14,45],[-13,16,36],[22,12,33],[-2,-17,33],[0,0,47]].forEach((q,i)=>{const c=cols[i];
  D('',w,`left:${q[0]-q[2]/2}vmax;top:${q[1]-q[2]/2}vmax;width:${q[2]}vmax;height:${q[2]}vmax;background:radial-gradient(circle,${c}b0,${c}70 50%,${c}00 70%);--x:${6+r()*3}vmax;--y:${5+r()*4}vmax;--d:${9+r()*8|0}s;animation-delay:-${r()*10|0}s`)});
 return s}

// The Coast: rolling ocean swells
function waves(){
 const s=scene('coast');
 [[500,18,'#4FC3F7',14,0,48],[250,12,'#29B6F6',10,1,36],[1000/6,9,'#0288D1',7,0,26]].forEach(l=>{
  const v=E('svg',{viewBox:'0 0 2000 120',preserveAspectRatio:'none'});
  v.style.cssText=`position:absolute;left:0;bottom:0;width:200%;height:${l[5]}vh;animation:wv ${l[3]}s linear infinite${l[4]?' reverse':''}`;
  let d='M0,120';for(let x=0;x<=2000;x+=10)d+=`L${x},${F(24+l[1]+l[1]*Math.sin(6.2832*x/l[0]))}`;
  E('path',{d:d+'L2000,120Z',fill:l[2],'fill-opacity':.55},v);s.appendChild(v)})}

// Simulator Radio: night city with train, traffic and a radio tower
function city(){
 const s=scene('sim'),r=R(7),v=E('svg',{viewBox:'0 0 400 200',preserveAspectRatio:'xMidYMax slice'});
 v.style.cssText='position:absolute;left:0;bottom:0;width:100%;height:44vh';s.appendChild(v);
 const sh=['#141A2C','#1B2240','#10162A'],A=[],B=[],tw=[];let x=0;
 while(x<400){const bw=14+r()*22|0,bh=35+r()*100|0,top=186-bh;
  E('rect',{x,y:top,width:bw,height:bh,fill:sh[r()*3|0]},v);
  for(let y=top+4;y<182;y+=7)for(let xx=x+3;xx<x+bw-3;xx+=5){const q=r();if(q>.45)continue;if(q<.05){tw.push([xx,y]);continue}(q<.12?B:A).push(`M${xx},${y}h2v3h-2z`)}
  x+=bw+(r()*3|0)}
 E('path',{d:A.join(''),fill:'#FFD27A','fill-opacity':.85},v);
 E('path',{d:B.join(''),fill:'#8FD3FF','fill-opacity':.85},v);
 tw.forEach(q=>E('rect',{x:q[0],y:q[1],width:2,height:3,fill:'#FFE9A8',style:`animation:tw ${1+r()*3}s ease-in-out ${-r()*3}s infinite alternate`},v));
 E('rect',{x:0,y:104,width:400,height:1,fill:'#2C3458'},v);
 const tr=E('g',{style:'animation:carR 22s linear infinite'},v);
 for(let j=0;j<4;j++)E('rect',{x:j*17,y:100,width:15,height:4,rx:1,fill:'#FFE3A0'},tr);
 E('rect',{x:0,y:186,width:400,height:14,fill:'#0A0E1A'},v);
 for(let i=0;i<8;i++){const o=i%2;E('rect',{x:0,y:o?193:189,width:6,height:2,fill:o?'#FF4D4D':'#fff',style:`animation:${o?'carL':'carR'} ${7+r()*9|0}s linear ${-r()*8|0}s infinite`},v)}
 // radio tower
 const g=E('g',{transform:'translate(28 60) scale(.42)',opacity:.4},v),ys=[300,250,200,150,105,65];
 let d='M15,300L46,65M85,300L54,65M50,65L50,10',xl=y=>15+31*(300-y)/235;
 ys.forEach((y,i)=>{d+=`M${F(xl(y))},${y}L${F(100-xl(y))},${y}`;if(i){const p=ys[i-1];d+=`M${F(xl(p))},${p}L${F(100-xl(y))},${y}M${F(100-xl(p))},${p}L${F(xl(y))},${y}`}});
 E('path',{d,stroke:'#fff','stroke-width':2.5,fill:'none'},g);
 E('circle',{cx:50,cy:8,r:5,fill:'#FF3B3B',style:'animation:bl .7s ease-in-out infinite alternate'},g);
 for(let k=0;k<3;k++){const rr=24+k*20,c=Math.SQRT1_2;
  [[1,0],[-1,0]].forEach(sd=>E('path',{d:`M${F(50+sd[0]*rr*c)},${F(8-rr*c)}A${rr},${rr} 0 0 ${sd[0]>0?1:0} ${F(50+sd[0]*rr*c)},${F(8+rr*c)}`,stroke:'#fff','stroke-width':2.5,fill:'none',style:`animation:bl .9s ease-in-out ${k*.35}s infinite alternate;opacity:.9`},g))}}

// Halloween: corner spider webs and a dangling spider
function webs(){
 const s=scene('halloween');let d='';
 for(let i=0;i<6;i++){const a=i*Math.PI/10;d+=`M0,0L${F(100*Math.cos(a))},${F(100*Math.sin(a))}`}
 for(let k=1;k<=5;k++){const r=k*20;for(let i=0;i<5;i++){const a=i*Math.PI/10,b=a+Math.PI/10,m=a+Math.PI/20,sg=r*.86;
  d+=`M${F(r*Math.cos(a))},${F(r*Math.sin(a))}Q${F(sg*Math.cos(m))},${F(sg*Math.sin(m))} ${F(r*Math.cos(b))},${F(r*Math.sin(b))}`}}
 [['left:0;top:0','1,1'],['right:0;top:0','-1,1'],['left:0;bottom:0','1,-1'],['right:0;bottom:0','-1,-1']].forEach(q=>{
  const v=E('svg',{viewBox:'0 0 100 100'});
  v.style.cssText=`position:absolute;${q[0]};width:min(60vw,300px);height:min(60vw,300px);transform:scale(${q[1]});opacity:.55`;
  E('path',{d,fill:'none',stroke:'#fff','stroke-width':.6},v);s.appendChild(v)});
 D('sp',s).innerHTML='<svg viewBox="0 0 40 140" width="40" height="140"><line x1="20" y1="-300" x2="20" y2="80" stroke="#fff" stroke-opacity=".6"/><path d="M20,86L4,78M20,86L1,88M20,86L5,100M20,86L36,78M20,86L39,88M20,86L35,100" stroke="#2A2A34" stroke-width="1.5" fill="none"/><ellipse cx="20" cy="86" rx="9" ry="7.5" fill="#15151B" stroke="#fff" stroke-opacity=".5"/><ellipse cx="20" cy="76" rx="4.5" ry="4" fill="#15151B" stroke="#fff" stroke-opacity=".5"/></svg>'}

// The Blues: crescent moon and palmetto, like the South Carolina flag
function blues(){
 const s=scene('blues');
 s.innerHTML='<svg viewBox="0 0 120 120" style="position:absolute;left:5vw;top:8vh;width:min(34vw,170px);opacity:.3"><defs><mask id="mm"><circle cx="60" cy="60" r="56" fill="#fff"/><circle cx="86" cy="42" r="48" fill="#000"/></mask></defs><circle cx="60" cy="60" r="56" fill="#fff" mask="url(#mm)"/></svg>';
 let d='M92,320L108,320L104,112L96,112Z';
 for(let i=0;i<9;i++){const a=(-170+i*20)*Math.PI/180;d+=lf(100,110,a,95,11,28*Math.abs(Math.cos(a)))}
 const v=E('svg',{viewBox:'0 0 200 330'});v.style.cssText='position:absolute;right:4vw;bottom:6vh;height:46vh;opacity:.3';
 E('path',{d,fill:'#fff'},v);s.appendChild(v)}

// Purple Cat: green gradient with hanging plants
function forest(){
 const s=haze('forest',['#031009','#0B3B1E','#052414'],['#1F7A3D','#2E9E50','#0E4D2A','#3FBF6A','#145A32','#6FD38A','#0B3D22'],5),r=R(23);
 const v=E('svg',{viewBox:'0 0 400 330',preserveAspectRatio:'xMidYMin slice'});
 v.style.cssText='position:absolute;left:0;top:0;width:100%;height:62vh';s.appendChild(v);
 const G=['#58C27D','#3CB371','#2E8B57','#7BD389','#1E6B3A'];
 [70,200,330].forEach(px=>{
  const py=36+r()*30,g=E('g',{style:`transform-origin:${px}px 0;animation:sw ${5+r()*4|0}s ease-in-out ${-r()*6|0}s infinite alternate`},v);
  E('path',{d:`M${px},0L${px-11},${py}M${px},0L${px+11},${py}`,stroke:'#B58B5A','stroke-width':.8,fill:'none'},g);
  E('path',{d:`M${px-12},${py}L${px+12},${py}L${px+8},${py+17}L${px-8},${py+17}Z`,fill:'#8A4B2D'},g);
  E('rect',{x:px-13,y:py-3,width:26,height:3,fill:'#A25C38'},g);
  const n=4+r()*3|0;
  for(let i=0;i<n;i++){
   const x0=px-10+r()*20,L=70+r()*140,gg=E('g',{style:`transform-origin:${F(x0)}px ${py}px;animation:sw ${3+r()*4|0}s ease-in-out ${-r()*6|0}s infinite alternate`},g);
   const ph=r()*6,st=Math.max(6,L/12|0),sb=G.map(()=>[]);let stem=`M${F(x0)},${py}`;
   for(let j=1;j<=st;j++){const t=j/st,sx=x0+5*Math.sin(t*5+ph)*t,sy=py+t*L;stem+=`L${F(sx)},${F(sy)}`;
    const a=Math.PI/2+(j%2?-1:1)*(.7+r()*.5),len=(17+r()*11)*(1-.35*t);sb[r()*5|0].push(lf(sx,sy,a,len,len*.55))}
   E('path',{d:stem,stroke:'#1B5E34','stroke-width':1,fill:'none'},gg);
   sb.forEach((a,k)=>{if(a.length)E('path',{d:a.join(''),fill:G[k],'fill-opacity':.92},gg)})}
  const rim=G.map(()=>[]);
  for(let j=0;j<12;j++)rim[r()*5|0].push(lf(px-10+r()*20,py-2,-Math.PI/2+(r()-.5)*2.2,17+r()*11,10));
  rim.forEach((a,k)=>{if(a.length)E('path',{d:a.join(''),fill:G[k]},g)})})}

haze('kiis',['#1E0B3D','#4A1763','#1A1050'],['#FF3D9A','#FF8A3D','#7B3FE4','#3DD6D0','#FF5AD0','#FFC15A','#4B2BB5'],11);
waves();city();webs();blues();forest();

// ---- stations ----
const ST=[
['SomaFM - Groove Salad','https://ice1.somafm.com/groovesalad-128-mp3'],
['SomaFM - Defcon Radio','https://ice1.somafm.com/defcon-128-mp3'],
['Radio Paradise','https://stream.radioparadise.com/mp3-128'],
['KEXP Seattle','https://kexp.streamguys1.com/kexp128.mp3'],
['BBC World Service','https://stream.live.vc.bbcmedia.co.uk/bbc_world_service'],
['Simulator Radio','https://simulatorradio.stream/stream?t=1792616937','sim'],
['Miami Chilltrax','https://streamssl.chilltrax.com/;'],
['Metal Rock Radio','https://cast3.torontocast.com:1310/;'],
['The Coast','https://ice64.securenetsystems.net/THECOAST','coast'],
['Key 93.7','https://ice8.securenetsystems.net/WKEYFM'],
['The Mellow Sound','https://free.rcast.net/200491'],
['97 Underground','https://s6.reliastream.com/proxy/97underground?mp=/stream'],
['24/7 Lo-Fi Radio','https://ec3.yesstreaming.net:3755/stream'],
['Chill Digital Radio','https://ice-sov.musicradio.com/ChillMP3'],
['Frisky Radio','https://stream.chill.friskyradio.com/mp3_low'],
['Plan-A Radio','https://s5.radio.co/s49dfee81d/listen'],
['Harley Davidson Radio','https://hdradioclassicrock-rfritschka.radioca.st/;','harley'],
['Harley Davidson Radio: The Blues','https://haradioblues-rfritschka.radioca.st/;','blues'],
['Halloween Radio','https://radio1.streamserver.link:8000/hrm-aac','halloween'],
['Purple Cat Radio','https://das-edge63-live365-dal03.cdnstream.com/a30440?listeningSessionId=V1dDRUc3NFhLVzZZUjJMUDNPVE9WQVFPR01fZGFzLWVkZ2U2My1saXZlMzY1LWRhbDAzLmNkbnN0cmVhbS5jb206ODE4Ng..&aw_0_1st.playerId=Live365-Widget&aw_0_1st.skey=1792727280480','forest'],
['102.7 KIIS FM','https://cloud.revma.ihrhls.com/zc185?rj-org=n1cb-e2&rj-ttl=5&rj-tok=AAABoWaQOGYAbs2WXHLwNU64vQ','kiis']
];
// accent colour and logo badge per station theme
const TH={harley:['#FF6A00','HARLEY-DAVIDSON','#FF6A00','#0F0F14'],blues:[0,'HARLEY-DAVIDSON','#FF6A00','#0F0F14'],sim:[0,'SIMULATOR RADIO','#2F6FDE','#fff'],coast:['#1EB4E6']};

const a=new Audio();a.preload='none';
let cur=-1,want=false,last=null;
const list=$('list'),now=$('now'),stat=$('stat'),go=$('go'),vol=$('vol'),badge=$('badge');
ST.forEach((s,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.textContent=s[0];b.onclick=()=>start({n:s[0],u:s[1],t:s[2]||''},i);li.appendChild(b);list.appendChild(li)});
const mark=()=>list.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',i===cur?'true':'false'));
function theme(t){
 const h=TH[t]||[];
 document.documentElement.style.setProperty('--acc',h[0]||'#FF5A5F');
 if(h[1]){badge.textContent=h[1];badge.style.cssText=`display:inline-block;background:${h[2]};color:${h[3]}`}else badge.style.display='none';
 bg.querySelectorAll('.sc').forEach(e=>e.classList.toggle('on',e.dataset.k===t))}
function media(st){try{if('mediaSession' in navigator){
 navigator.mediaSession.metadata=new MediaMetadata({title:st.n,artist:'Live Radio'});
 navigator.mediaSession.setActionHandler('play',()=>start(last,cur));
 navigator.mediaSession.setActionHandler('pause',stop);navigator.mediaSession.setActionHandler('stop',stop)}}catch(e){}}
function start(st,i){
 last=st;want=true;cur=i===undefined?-1:i;mark();
 now.textContent=st.n;stat.textContent='Connecting\u2026';go.textContent='Stop';
 theme(st.t);a.src=st.u;
 const p=a.play();if(p&&p.catch)p.catch(e=>{if(!e||e.name!=='AbortError')if(want)fail()});
 media(st)}
function stop(){
 want=false;document.body.classList.remove('playing');
 a.pause();a.removeAttribute('src');a.load();
 go.textContent='Play';stat.textContent='Stopped';theme('')}
function fail(){
 want=false;document.body.classList.remove('playing');go.textContent='Play';theme('');
 stat.textContent='Can\u2019t play this stream. Try another station, and check that the link uses https.'}
a.addEventListener('playing',()=>{document.body.classList.add('playing');stat.textContent='Live'});
